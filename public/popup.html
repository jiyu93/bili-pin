<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bili Pin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #10131a;
        --shell: rgba(17, 22, 31, 0.94);
        --panel: rgba(27, 34, 46, 0.88);
        --border: rgba(145, 175, 214, 0.16);
        --text: #f7fbff;
        --muted: #9aa8bd;
        --accent: #7bc4ff;
        --accent-soft: rgba(123, 196, 255, 0.16);
        --shadow: rgba(4, 9, 16, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 10px;
        background:
          radial-gradient(circle at top right, rgba(123, 196, 255, 0.2), transparent 34%),
          linear-gradient(180deg, #151b26 0%, #0f1219 100%);
        color: var(--text);
        font: 13px/1.45 "SF Pro Display", "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
      }

      .shell {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border: 1px solid rgba(163, 195, 229, 0.12);
        border-radius: 18px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0)),
          var(--shell);
        box-shadow:
          0 18px 44px var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 15px;
        background:
          radial-gradient(circle at top right, rgba(123, 196, 255, 0.18), transparent 36%),
          linear-gradient(145deg, rgba(37, 46, 63, 0.96), rgba(22, 27, 37, 0.96));
      }

      .hero::after {
        content: "";
        position: absolute;
        inset: auto -22px -26px auto;
        width: 92px;
        height: 92px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(123, 196, 255, 0.22), rgba(123, 196, 255, 0));
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .title {
        margin: 0;
        font-size: 24px;
        line-height: 1.05;
        font-weight: 760;
        letter-spacing: -0.04em;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .card {
        min-height: 112px;
        padding: 12px 12px 11px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.025), rgba(255, 255, 255, 0)),
          var(--panel);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .label {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .metric {
        margin: 0;
        color: var(--text);
        font-size: 30px;
        line-height: 1;
        font-weight: 760;
        letter-spacing: -0.05em;
      }

      .timestamp {
        margin: 0;
        color: var(--text);
        font-size: 14px;
        line-height: 1.35;
        font-weight: 620;
        letter-spacing: -0.01em;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Bili Pin</p>
          <h1 class="title">同步摘要</h1>
        </div>
      </section>

      <section class="grid">
        <div class="card">
          <p class="label">头像数量</p>
          <p id="avatarCount" class="metric">-</p>
        </div>
        <div class="card">
          <p class="label">最后同步时间</p>
          <p id="lastSyncedAt" class="timestamp">-</p>
        </div>
      </section>
    </div>

    <script src="./popup.js"></script>
  </body>
  </html>
